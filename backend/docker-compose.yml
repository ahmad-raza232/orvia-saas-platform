services:
  postgres:
    image: postgres:16-alpine
    container_name: orvia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: orvia
      POSTGRES_PASSWORD: orvia
      POSTGRES_DB: orvia
    ports:
      - "5433:5432"
    volumes:
      - orvia_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orvia -d orvia"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: orvia-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://orvia:orvia@postgres:5432/orvia
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    build: .
    container_name: orvia-outbox-worker
    restart: unless-stopped
    profiles: ["worker"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://orvia:orvia@postgres:5432/orvia
      OUTBOX_WORKER_ENABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy
    command: python -m app.worker

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: orvia-minio
    profiles: ["storage"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: orvia
      MINIO_ROOT_PASSWORD: orviadevpassword
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - orvia_minio_data:/data

volumes:
  orvia_postgres_data:
  orvia_minio_data:
